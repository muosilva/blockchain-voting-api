<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blockchain Voting System - Demonstração</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e27;
      --bg-secondary: #151932;
      --bg-card: #1e2339;
      --border: #2d3348;
      --text-primary: #e4e7f1;
      --text-secondary: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1f3a 100%);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      border-bottom: 2px solid var(--border);
      padding: 2rem;
      margin-bottom: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent), var(--info));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    /* Controls */
    .controls {
      background: var(--bg-card);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }

    .file-selector {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button {
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    select {
      flex: 1;
      min-width: 250px;
    }

    button {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error State */
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .card-icon {
      font-size: 1.5rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .card-content {
      color: var(--text-secondary);
    }

    /* Phase Badge */
    .phase-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .phase-not-started {
      background: rgba(107, 114, 128, 0.2);
      color: #9ca3af;
    }

    .phase-commit {
      background: rgba(59, 130, 246, 0.2);
      color: var(--info);
    }

    .phase-reveal {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .phase-ended {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    /* Stats */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }

    .stat {
      background: var(--bg-secondary);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* Timeline */
    .timeline {
      position: relative;
      padding: 2rem 0;
    }

    .timeline-item {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 40px;
      bottom: -20px;
      width: 2px;
      background: var(--border);
    }

    .timeline-item:last-child::before {
      display: none;
    }

    .timeline-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: bold;
      z-index: 1;
    }

    .timeline-icon.commit {
      background: rgba(59, 130, 246, 0.2);
      color: var(--info);
      border: 2px solid var(--info);
    }

    .timeline-icon.reveal {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
      border: 2px solid var(--warning);
    }

    .timeline-content {
      flex: 1;
      background: var(--bg-secondary);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .timeline-title {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .timeline-details {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .timeline-hash {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      background: var(--bg-primary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      margin-top: 0.5rem;
      word-break: break-all;
    }

    /* Results */
    .results-container {
      background: var(--bg-secondary);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .option-result {
      margin-bottom: 1.5rem;
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .option-name {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .option-votes {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .progress-bar {
      height: 30px;
      background: var(--bg-primary);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--info));
      transition: width 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 0.75rem;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .winner-badge {
      display: inline-block;
      background: var(--success);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }

    /* Metrics */
    .metric-section {
      margin-bottom: 1.5rem;
    }

    .metric-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .metric-list {
      display: grid;
      gap: 0.75rem;
    }

    .metric-item {
      display: flex;
      justify-content: space-between;
      background: var(--bg-secondary);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .metric-key {
      color: var(--text-secondary);
    }

    .metric-value {
      font-weight: 600;
      font-family: 'Courier New', monospace;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
    }

    .tab {
      padding: 0.75rem 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--text-primary);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Code Block */
    .code-block {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    /* Address */
    .address {
      font-family: 'Courier New', monospace;
      background: var(--bg-primary);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      word-break: break-all;
    }

    /* Info Box */
    .info-box {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--info);
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
    }

    .info-box-title {
      font-weight: 600;
      color: var(--info);
      margin-bottom: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .file-selector {
        flex-direction: column;
      }

      select, button {
        width: 100%;
      }

      .stat-value {
        font-size: 1.25rem;
      }
    }

    /* Hidden */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🗳️ Blockchain Voting System</h1>
      <p class="subtitle">Demonstração do Sistema de Votação com Commit-Reveal + Token-Gated</p>
    </header>

    <div class="controls">
      <div class="file-selector">
        <select id="simulationSelect">
          <option value="">Carregando simulações...</option>
        </select>
        <button id="loadButton" onclick="loadSimulation()">Carregar Simulação</button>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Carregando dados...</p>
    </div>

    <div id="error" class="error hidden"></div>

    <div id="content" class="hidden">
      <!-- Overview Section -->
      <section class="grid grid-2">
        <div class="card">
          <div class="card-header">
            <span class="card-icon">📋</span>
            <h2 class="card-title">Informações da Votação</h2>
          </div>
          <div class="card-content">
            <div id="votingInfo"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-icon">📊</span>
            <h2 class="card-title">Estatísticas Gerais</h2>
          </div>
          <div class="card-content">
            <div class="stat-grid" id="generalStats"></div>
          </div>
        </div>
      </section>

      <!-- Results Section -->
      <section class="card">
        <div class="card-header">
          <span class="card-icon">🏆</span>
          <h2 class="card-title">Resultados da Votação</h2>
        </div>
        <div class="card-content">
          <div class="results-container" id="results"></div>
        </div>
      </section>

      <!-- Tabs Section -->
      <section class="card">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('timeline')">⏱️ Timeline</button>
          <button class="tab" onclick="switchTab('metrics')">📈 Métricas</button>
          <button class="tab" onclick="switchTab('crypto')">🔐 Processo Criptográfico</button>
          <button class="tab" onclick="switchTab('transactions')">💰 Transações</button>
        </div>

        <div id="tab-timeline" class="tab-content active">
          <div class="timeline" id="timeline"></div>
        </div>

        <div id="tab-metrics" class="tab-content">
          <div id="metricsContent"></div>
        </div>

        <div id="tab-crypto" class="tab-content">
          <div id="cryptoContent"></div>
        </div>

        <div id="tab-transactions" class="tab-content">
          <div id="transactionsContent"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let currentData = null;
    let availableSimulations = [];

    // Initialize
    async function init() {
      await loadAvailableSimulations();
    }

    // Load available simulations from cache folder
    async function loadAvailableSimulations() {
      const select = document.getElementById('simulationSelect');

      // Common simulation file patterns
      const patterns = [
        'simulate-sim-1.json',
        'simulate-sim-2.json',
        'simulate-sim-3.json',
        'simulate-sim-4.json',
        'simulate-sim-5.json',
        'simulate-sim-6.json',
        'simulate-sim-7.json',
        'simulate-sim-8.json',
        'simulate-sim-9.json',
        'simulate-sim-10.json',
        'simulate-sim-11.json',
        'simulate-sim-12.json',
        'simulate-sim-13.json',
        'simulate-sim-14.json',
        'simulate-sim-15.json',
        'simulate-sim-16.json',
        'simulate-test-simplevoting.json',
        'simulate-test-tokenizedvoting.json'
      ];

      availableSimulations = [];

      for (const file of patterns) {
        try {
          const response = await fetch(`../cache/${file}`);
          if (response.ok) {
            availableSimulations.push(file);
          }
        } catch (e) {
          // File doesn't exist, skip
        }
      }

      if (availableSimulations.length === 0) {
        select.innerHTML = '<option value="">Nenhuma simulação encontrada</option>';
        return;
      }

      select.innerHTML = '<option value="">Selecione uma simulação</option>' +
        availableSimulations.map(file =>
          `<option value="${file}">${file.replace('simulate-', '').replace('.json', '')}</option>`
        ).join('');

      // Auto-load first simulation
      if (availableSimulations.length > 0) {
        select.value = availableSimulations[0];
        loadSimulation();
      }
    }

    // Load simulation data
    async function loadSimulation() {
      const select = document.getElementById('simulationSelect');
      const filename = select.value;

      if (!filename) return;

      showLoading();
      hideError();

      try {
        // Add cache-busting parameter to prevent browser caching
        const cacheBuster = new Date().getTime();
        const response = await fetch(`../cache/${filename}?v=${cacheBuster}`);
        if (!response.ok) throw new Error('Arquivo não encontrado');

        currentData = await response.json();
        console.log('Loaded simulation data:', filename);
        console.log('Full metadata:', currentData.metadata);
        renderContent();
        hideLoading();
        showContent();
      } catch (error) {
        showError(`Erro ao carregar simulação: ${error.message}`);
        hideLoading();
      }
    }

    // Render all content
    function renderContent() {
      if (!currentData) return;

      renderVotingInfo();
      renderGeneralStats();
      renderResults();
      renderTimeline();
      renderMetrics();
      renderCryptoProcess();
      renderTransactions();
    }

    // Render voting info
    function renderVotingInfo() {
      const info = currentData.metadata;
      console.log('Current Phase Value:', info.currentPhase, 'Type:', typeof info.currentPhase);
      console.log('Finalized Value:', info.finalized, 'Type:', typeof info.finalized);
      const html = `
        <div class="metric-list">
          <div class="metric-item">
            <span class="metric-key">Nome da Votação</span>
            <span class="metric-value">${info.name}</span>
          </div>
          <div class="metric-item">
            <span class="metric-key">Fase Atual</span>
            <span class="metric-value">${getPhaseBadge(info.currentPhase)}</span>
          </div>
          <div class="metric-item">
            <span class="metric-key">Rede</span>
            <span class="metric-value">${currentData.network.name} (Chain ID: ${currentData.network.chainId})</span>
          </div>
          <div class="metric-item">
            <span class="metric-key">Contrato</span>
            <span class="metric-value address">${currentData.contractAddress}</span>
          </div>
          ${currentData.stakeTokenAddress ? `
          <div class="metric-item">
            <span class="metric-key">Stake Token</span>
            <span class="metric-value address">${currentData.stakeTokenAddress}</span>
          </div>
          ` : ''}
          <div class="metric-item">
            <span class="metric-key">Finalizado</span>
            <span class="metric-value">${info.finalized ? '✅ Sim' : '❌ Não'}</span>
          </div>
        </div>
      `;
      document.getElementById('votingInfo').innerHTML = html;
    }

    // Render general stats
    function renderGeneralStats() {
      const info = currentData.metadata;
      const metrics = currentData.metrics;

      const html = `
        <div class="stat">
          <div class="stat-label">Total de Votos</div>
          <div class="stat-value">${info.totalVotes}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Opções</div>
          <div class="stat-value">${info.optionCount}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Commits</div>
          <div class="stat-value">${metrics.performance.gas.commit?.count || 0}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Reveals</div>
          <div class="stat-value">${metrics.performance.gas.reveal?.count || 0}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Gas Total</div>
          <div class="stat-value">${formatNumber(calculateTotalGas())}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Custo Total</div>
          <div class="stat-value">${calculateTotalCost()} ETH</div>
        </div>
      `;
      document.getElementById('generalStats').innerHTML = html;
    }

    // Render results
    function renderResults() {
      const options = currentData.optionLabels;
      const counts = currentData.optionCounts;
      const total = counts.reduce((a, b) => a + b, 0);
      const maxVotes = Math.max(...counts);

      const html = options.map((option, index) => {
        const votes = counts[index];
        const percentage = total > 0 ? (votes / total * 100).toFixed(1) : 0;
        const isWinner = votes === maxVotes && votes > 0;

        return `
          <div class="option-result">
            <div class="option-header">
              <span class="option-name">
                ${option}
                ${isWinner ? '<span class="winner-badge">🏆 Vencedor</span>' : ''}
              </span>
              <span class="option-votes">${votes} voto${votes !== 1 ? 's' : ''}</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width: ${percentage}%">
                ${percentage}%
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('results').innerHTML = html;
    }

    // Render timeline
    function renderTimeline() {
      const transactions = currentData.telemetry?.transactions || [];
      const commits = transactions.filter(tx => tx.type === 'vote-commit');
      const reveals = transactions.filter(tx => tx.type === 'vote-reveal');

      const html = `
        <div class="info-box">
          <div class="info-box-title">📝 Processo Commit-Reveal</div>
          <p>O sistema utiliza o padrão Commit-Reveal para garantir privacidade temporal dos votos.</p>
          <p><strong>Fase Commit:</strong> Votantes registram um hash criptográfico (commitment) sem revelar o voto.</p>
          <p><strong>Fase Reveal:</strong> Votantes revelam o voto + salt, que é validado contra o commitment anterior.</p>
        </div>

        <h3 style="margin-bottom: 1rem;">🔵 Fase Commit</h3>
        ${commits.map((tx, index) => `
          <div class="timeline-item">
            <div class="timeline-icon commit">C${index + 1}</div>
            <div class="timeline-content">
              <div class="timeline-title">${tx.label || 'Commit'} - Opção ${tx.optionIndex}</div>
              <div class="timeline-details">
                <div><strong>Endereço:</strong> <span class="address">${tx.accountAddress}</span></div>
                ${tx.tokenId !== null ? `<div><strong>Token ID:</strong> ${tx.tokenId}</div>` : ''}
                <div><strong>Timestamp:</strong> ${new Date(tx.timestamp * 1000).toLocaleString('pt-BR')}</div>
                <div><strong>Gas:</strong> ${formatNumber(tx.gasUsed)} (${tx.feeEth} ETH)</div>
                <div class="timeline-hash"><strong>TX Hash:</strong> ${tx.txHash}</div>
              </div>
            </div>
          </div>
        `).join('')}

        <h3 style="margin: 2rem 0 1rem;">🟠 Fase Reveal</h3>
        ${reveals.map((tx, index) => `
          <div class="timeline-item">
            <div class="timeline-icon reveal">R${index + 1}</div>
            <div class="timeline-content">
              <div class="timeline-title">${tx.label || 'Reveal'} - Opção ${tx.optionIndex}</div>
              <div class="timeline-details">
                <div><strong>Endereço:</strong> <span class="address">${tx.accountAddress}</span></div>
                <div><strong>Timestamp:</strong> ${new Date(tx.timestamp * 1000).toLocaleString('pt-BR')}</div>
                <div><strong>Gas:</strong> ${formatNumber(tx.gasUsed)} (${tx.feeEth} ETH)</div>
                <div class="timeline-hash"><strong>TX Hash:</strong> ${tx.txHash}</div>
              </div>
            </div>
          </div>
        `).join('')}
      `;

      document.getElementById('timeline').innerHTML = html;
    }

    // Render metrics
    function renderMetrics() {
      const metrics = currentData.metrics;

      const html = `
        <div class="metric-section">
          <div class="metric-title">⚡ Performance</div>
          <div class="metric-list">
            ${metrics.performance.gas.commit ? `
              <div class="metric-item">
                <span class="metric-key">Gas Médio por Commit</span>
                <span class="metric-value">${formatNumber(metrics.performance.gas.commit.avgGas)}</span>
              </div>
            ` : ''}
            ${metrics.performance.gas.reveal ? `
              <div class="metric-item">
                <span class="metric-key">Gas Médio por Reveal</span>
                <span class="metric-value">${formatNumber(metrics.performance.gas.reveal.avgGas)}</span>
              </div>
            ` : ''}
            <div class="metric-item">
              <span class="metric-key">Commits por Segundo</span>
              <span class="metric-value">${metrics.performance.throughput.commitsPerSecond.toFixed(4)}</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Reveals por Segundo</span>
              <span class="metric-value">${metrics.performance.throughput.revealsPerSecond.toFixed(4)}</span>
            </div>
          </div>
        </div>

        <div class="metric-section">
          <div class="metric-title">🔒 Segurança</div>
          <div class="metric-list">
            <div class="metric-item">
              <span class="metric-key">Total de Commits</span>
              <span class="metric-value">${metrics.security.credentialIntegrity.totalCommits}</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Credenciais Únicas</span>
              <span class="metric-value">${metrics.security.credentialIntegrity.uniqueCredentials}</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Credenciais Duplicadas</span>
              <span class="metric-value" style="color: ${metrics.security.credentialIntegrity.duplicateCredentials > 0 ? 'var(--danger)' : 'var(--success)'}">
                ${metrics.security.credentialIntegrity.duplicateCredentials}
              </span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Commitments Únicos</span>
              <span class="metric-value">${metrics.security.credentialIntegrity.uniqueCommitments}</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Transações Falhadas</span>
              <span class="metric-value" style="color: ${metrics.security.transactionHealth.failedTransactions > 0 ? 'var(--danger)' : 'var(--success)'}">
                ${metrics.security.transactionHealth.failedTransactions}
              </span>
            </div>
            ${metrics.security.auditTrail.executed ? `
              <div class="metric-item">
                <span class="metric-key">Audit Snapshot</span>
                <span class="metric-value">✅ Executado</span>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="metric-section">
          <div class="metric-title">👥 Usabilidade</div>
          <div class="metric-list">
            <div class="metric-item">
              <span class="metric-key">Total de Votantes</span>
              <span class="metric-value">${metrics.usability.voters}</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Transações por Votante</span>
              <span class="metric-value">${metrics.usability.transactionsPerVoter}</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Custo Médio por Voto</span>
              <span class="metric-value">${metrics.usability.avgVoteFeeEth} ETH</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Taxa de Sucesso</span>
              <span class="metric-value">${(metrics.usability.successRate * 100).toFixed(1)}%</span>
            </div>
          </div>
        </div>
      `;

      document.getElementById('metricsContent').innerHTML = html;
    }

    // Render crypto process
    function renderCryptoProcess() {
      const html = `
        <div class="info-box">
          <div class="info-box-title">🔐 Como Funciona o Processo Criptográfico</div>
          <p>O sistema utiliza hashing criptográfico para garantir privacidade e integridade.</p>
        </div>

        <div class="metric-section">
          <div class="metric-title">1️⃣ Preparação (Off-chain)</div>
          <div class="code-block">// Issuer gera credential hash único para cada votante
credentialHash = keccak256(randomBytes)

// Issuer assina o credential hash
signature = sign(credentialHash, issuerPrivateKey)

// Votante recebe: (credentialHash, signature)</div>
        </div>

        <div class="metric-section">
          <div class="metric-title">2️⃣ Commit Phase (On-chain)</div>
          <div class="code-block">// Votante escolhe opção e gera salt aleatório
optionIndex = 0  // Por exemplo, "Sim"
salt = randomBytes32()
committer = msg.sender  // Endereço do votante

// Calcula o commitment
commitment = keccak256(
  credentialHash,
  optionIndex,
  salt,
  committer
)

// Envia para blockchain
contract.commitVote(credentialHash, commitment, signature)

// Blockchain verifica:
// 1. Assinatura do issuer é válida
// 2. Credential não foi usado antes
// 3. Está na janela de commit
// Armazena commitment (VOTO AINDA ESTÁ OCULTO!)</div>
        </div>

        <div class="metric-section">
          <div class="metric-title">3️⃣ Reveal Phase (On-chain)</div>
          <div class="code-block">// Após janela de commit, votante revela
contract.revealVote(credentialHash, optionIndex, salt)

// Blockchain recalcula o commitment
storedCommitter = ballot[credentialHash].committer
computedCommitment = keccak256(
  credentialHash,
  optionIndex,
  salt,
  storedCommitter
)

// Valida e conta o voto
if (computedCommitment == storedCommitment) {
  tally[optionIndex]++  // VOTO CONTADO!
}</div>
        </div>

        <div class="metric-section">
          <div class="metric-title">🔑 Propriedades de Segurança</div>
          <div class="metric-list">
            <div class="metric-item">
              <span class="metric-key">Privacidade Temporal</span>
              <span class="metric-value">✅ Voto oculto até reveal phase</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Imutabilidade</span>
              <span class="metric-value">✅ Commitment não pode ser alterado</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Não-repúdio</span>
              <span class="metric-value">✅ Salt prova autoria do voto</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Autorização</span>
              <span class="metric-value">✅ Apenas credentials assinadas pelo issuer</span>
            </div>
            <div class="metric-item">
              <span class="metric-key">Double-Voting Prevention</span>
              <span class="metric-value">✅ Cada credential vota apenas 1x</span>
            </div>
          </div>
        </div>

        ${currentData.stakeTokenAddress ? `
        <div class="metric-section">
          <div class="metric-title">🎟️ Token-Gated Voting</div>
          <div class="code-block">// Para TokenizedVoting, também verifica ownership do NFT
tokenOwner = stakeToken.ownerOf(tokenId)
require(tokenOwner == msg.sender, "Não é dono do token")
require(!tokenUsed[tokenId], "Token já foi usado")

// Marca token como usado
tokenUsed[tokenId] = true</div>
        </div>
        ` : ''}
      `;

      document.getElementById('cryptoContent').innerHTML = html;
    }

    // Render transactions
    function renderTransactions() {
      const transactions = currentData.telemetry?.transactions || [];

      const html = `
        <div class="metric-section">
          <div class="metric-title">📊 Resumo de Transações</div>
          <div class="stat-grid">
            <div class="stat">
              <div class="stat-label">Total de TX</div>
              <div class="stat-value">${transactions.length}</div>
            </div>
            <div class="stat">
              <div class="stat-label">Gas Total</div>
              <div class="stat-value">${formatNumber(calculateTotalGas())}</div>
            </div>
            <div class="stat">
              <div class="stat-label">Custo Total</div>
              <div class="stat-value">${calculateTotalCost()}</div>
            </div>
          </div>
        </div>

        <div class="metric-section">
          <div class="metric-title">💳 Lista de Transações</div>
          ${transactions.map((tx, index) => `
            <div class="card" style="margin-bottom: 1rem;">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                <div>
                  <strong>${getTransactionTypeLabel(tx.type)}</strong>
                  ${tx.label ? `<span style="color: var(--text-secondary);"> - ${tx.label}</span>` : ''}
                </div>
                <span class="phase-badge phase-${tx.status}">${tx.status}</span>
              </div>
              <div class="metric-list">
                ${tx.actor ? `
                <div class="metric-item">
                  <span class="metric-key">Actor</span>
                  <span class="metric-value address">${tx.actor}</span>
                </div>
                ` : ''}
                ${tx.optionIndex !== null ? `
                <div class="metric-item">
                  <span class="metric-key">Opção</span>
                  <span class="metric-value">${tx.optionIndex}</span>
                </div>
                ` : ''}
                ${tx.tokenId !== null ? `
                <div class="metric-item">
                  <span class="metric-key">Token ID</span>
                  <span class="metric-value">${tx.tokenId}</span>
                </div>
                ` : ''}
                <div class="metric-item">
                  <span class="metric-key">Gas Usado</span>
                  <span class="metric-value">${formatNumber(tx.gasUsed)}</span>
                </div>
                <div class="metric-item">
                  <span class="metric-key">Custo</span>
                  <span class="metric-value">${tx.feeEth} ETH</span>
                </div>
                <div class="metric-item">
                  <span class="metric-key">Duração</span>
                  <span class="metric-value">${tx.durationMs.toFixed(2)} ms</span>
                </div>
                <div class="metric-item">
                  <span class="metric-key">Timestamp</span>
                  <span class="metric-value">${new Date(tx.timestamp * 1000).toLocaleString('pt-BR')}</span>
                </div>
                <div class="metric-item">
                  <span class="metric-key">TX Hash</span>
                  <span class="metric-value address">${tx.txHash}</span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      document.getElementById('transactionsContent').innerHTML = html;
    }

    // Helper functions
    function getPhaseBadge(phase) {
      const phases = ['Não Iniciado', 'Commit', 'Reveal', 'Finalizado'];
      const classes = ['phase-not-started', 'phase-commit', 'phase-reveal', 'phase-ended'];
      return `<span class="phase-badge ${classes[phase]}">${phases[phase]}</span>`;
    }

    function getTransactionTypeLabel(type) {
      const labels = {
        'deploy-voting': '🚀 Deploy Voting',
        'deploy-stake': '🎟️ Deploy Stake Token',
        'stake-mint': '✨ Mint Token',
        'stake-transfer': '↔️ Transfer Token',
        'vote-commit': '🔵 Commit Vote',
        'vote-reveal': '🟠 Reveal Vote',
        'audit-root': '📋 Audit Snapshot',
        'finalize': '🏁 Finalize'
      };
      return labels[type] || type;
    }

    function formatNumber(num) {
      return num.toLocaleString('pt-BR');
    }

    function calculateTotalGas() {
      if (!currentData?.telemetry?.transactions) return 0;
      return currentData.telemetry.transactions.reduce((sum, tx) => sum + tx.gasUsed, 0);
    }

    function calculateTotalCost() {
      if (!currentData?.telemetry?.transactions) return '0.000';
      const total = currentData.telemetry.transactions
        .reduce((sum, tx) => sum + parseFloat(tx.feeEth), 0);
      return total.toFixed(6);
    }

    function switchTab(tabName) {
      // Update tab buttons
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');

      // Update tab content
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    function showLoading() {
      document.getElementById('loading').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading').classList.add('hidden');
    }

    function showError(message) {
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = message;
      errorDiv.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('error').classList.add('hidden');
    }

    function showContent() {
      document.getElementById('content').classList.remove('hidden');
    }

    // Initialize on page load
    init();
  </script>
</body>
</html>
